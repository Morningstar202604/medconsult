# 汇诊 —— 生产级部署
# 本机无 Docker 环境，以下 compose 配置为未实测模板；部署时请按实际环境核对。
services:
  # PostgreSQL（企业版数据库，按需启用：docker compose --profile pg up -d）
  # 启用后设置 backend 环境变量 DATABASE_URL=postgresql+psycopg://medconsult:medconsult@pg:5432/medconsult
  pg:
    image: postgres:16-alpine
    profiles: ["pg"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: medconsult
      POSTGRES_PASSWORD: medconsult
      POSTGRES_DB: medconsult
    volumes:
      - medconsult_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medconsult"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - backend/.env
    environment:
      # 生产必须显式设置（或用 .env 提供）
      SECRET_KEY: ${SECRET_KEY:-please-change-me-32bytes-xxxxxxxxxxxxxxxxxxxx}
      PHI_ENCRYPTION_KEY: ${PHI_ENCRYPTION_KEY:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://open.bigmodel.cn/api/paas/v4}
      LLM_DEFAULT_MODEL: ${LLM_DEFAULT_MODEL:-glm-4.5-air}
      DEBUG: "false"
      ALLOW_SANDBOX_WITHOUT_LLM: "true"
      # 切换 PostgreSQL：docker compose --profile pg up -d 后取消注释
      # DATABASE_URL: postgresql+psycopg://medconsult:medconsult@pg:5432/medconsult
    depends_on:
      pg:
        condition: service_healthy
        required: false
    volumes:
      - medconsult_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  medconsult_data:
  medconsult_pg:

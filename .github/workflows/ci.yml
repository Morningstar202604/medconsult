name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Syntax check (stdlib-only core)
        run: python -m compileall app server.py
      - name: Import core modules (no heavy deps)
        run: |
          python -c "import ast, pathlib
          for p in pathlib.Path('app').glob('*.py'):
              ast.parse(p.read_text(encoding='utf-8'))
          print('AST OK')"

[project]
name = "medconsult"
version = "0.1.0"
description = "MedConsult (汇诊) - a local-first medical multi-agent consultation platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "MedConsult Contributors" }]
keywords = [
  "medical-ai", "multi-agent", "mdt", "clinical-decision-support",
  "llm", "rag", "healthcare", "agentclinic",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Healthcare Industry",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

[project.urls]
Homepage = "https://github.com/Morningstar202604/medconsult"
Issues = "https://github.com/Morningstar202604/medconsult/issues"
